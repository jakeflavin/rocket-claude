<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rocket-claude</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- CDN dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Register Chart.js components once, globally -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.Chart) return;
      Chart.defaults.color = '#9090b0';
      Chart.defaults.borderColor = '#2a2a3d';
      Chart.defaults.backgroundColor = 'transparent';
    });
  </script>

  <!-- Tailwind custom font config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0a0a0f]">
  <div id="root"></div>

  <!-- ─── UI Library (load order = dependency graph) ──────────────────── -->

  <!-- ─── Pages ─────────────────────────────────────────────────────────── -->
  <script type="text/babel" src="src/pages/Dashboard.jsx"></script>
